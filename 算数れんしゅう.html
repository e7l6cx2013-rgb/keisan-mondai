color:#2c9474;background:#ecf8f0}.answer.bad{border-color:#ce5b54;background:#fff0ee;animation:shake .25s}.unused{height:74px;background:repeating-linear-gradient(135deg,#f5f6f3,#f5f6f3 5px,#edf0e9 5px,#edf0e9 6px);margin:0 5px;border-radius:9px}.msg{text-align:center;min-height:30px;margin:18px 0 0;font-weight:700}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:24px 0;flex-wrap:wrap}.note{font-size:13px;line-height:1.7;color:#62756d}.rewards{margin:24px 0;background:#fff;border:1px solid #dce4da;border-radius:18px;padding:20px}.rewards h2{margin:0 0 8px;font-size:22px}.reward-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.reward-track{padding:12px;background:#f6f8ee;border-radius:12px}.reward-track strong{display:block;font-size:15px}.marks{display:grid;grid-template-columns:repeat(auto-fill,32px);gap:2px 6px;max-width:100%;margin-top:6px}.mark{text-align:center;min-width:0}.mark-star{display:block;font-size:24px;line-height:1.25}.mark-miss{display:block;font-size:12px;line-height:1.4;color:#7a6a38;font-variant-numeric:tabular-nums}.stars{font-size:24px;line-height:1.6;min-height:38px}.reward-count{font-size:13px;color:#62756d}.challenge{display:block;margin-top:8px;padding:8px 10px;border-radius:9px;background:#fff7d7;border-color:#e4c05b;font-weight:700}.best{display:block;margin-top:6px;font-size:12px;color:#62756d}details{margin-top:26px;background:#eaf0e8;border-radius:12px;padding:16px}summary{cursor:pointer;font-weight:700}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@media(max-width:650px){main{padding:20px 16px}.cards,.reward-grid{grid-template-columns:1fr}.sum{font-size:42px}header{align-items:flex-start}}\n</style><main><header><div><small>小学3年生・算数</small><h1>たし算のひっ算れんしゅう</h1></div><a href=\"index.html\"><button>メニューへ</button></a></header><p class=\"intro\">右の <b>一の位</b> から、答えをひとつずつ入れよう。<br>まちがえても だいじょうぶ。もう一度考えてみよう！</p><section class=\"tools\"><label>コース<select id=\"course\"><option value=\"2-1\">2けた ＋ 1けた</option><option value=\"2-2\">2けた ＋ 2けた</option><option value=\"3-2\">3けた ＋ 2けた</option><option value=\"3-3\">3けた ＋ 3けた</option></select></label><label>問題数<select id=\"count\"><option value=\"10\">10問</option><option value=\"20\">20問</option></select></label><label>くり上がり<select id=\"level\"><option value=\"all\">すべて</option><option value=\"easy\">くり上がりなし</option><option value=\"carry\">くり上がりあり</option></select></label><label><input id=\"erase\" type=\"checkbox\" checked>まちがえた数字を消す</label></section><div class=\"cards\" id=\"cards\"></div><div class=\"footer\"><strong id=\"score\" aria-live=\"polite\">できた問題：0問</strong><button class=\"primary\" id=\"next\">あたらしい問題 ↻</button></div><p class=\"note\">キーボードでも、タブレットの数字キーボードでも入力できます。色とメッセージでも正誤がわかります。</p><section class=\"rewards\" aria-labelledby=\"reward-title\"><h2 id=\"reward-title\">⭐️ がんばりの記録</h2><p class=\"note\">コースをぜんぶクリアすると、⭐️が1つふえるよ！ 20個たまるとタイムチャレンジが出るよ！</p><div id=\"reward-grid\" class=\"reward-grid\" aria-live=\"polite\"></div><p id=\"reward-storage\" class=\"note\"></p></section><details><summary>先生・おうちの方へ</summary><p>答えの各位を一の位から入力します。コースと問題数ごとに星とまちがえた数、タイムチャレンジの最高記録を、この端末・ブラウザーに保存します。くり上がりがある場所には、上に小さい枠が出ます。くり上がった1を入れてから次の位へ進みます。くり上がりの有無で問題を選べます。</p></details></main><script>\nconst $=s=>document.querySelector(s),courseLabels={'2-1':'2けた ＋ 1けた','2-2':'2けた ＋ 2けた','3-2':'3けた ＋ 2けた','3-3':'3けた ＋ 3けた'};let total=0,round=0,currentMistakes=0,rewards={},mistakes={},timeMode=false,timeLeft=0,timeDone=0,timeMistakes=0,timeTimer,timeCourse='',timeBest={},storageOK=true;\nconst rewardKey='addition-course-stars-v1';try{const saved=JSON.parse(localStorage.getItem(rewardKey)||'{}'),raw=saved.__mistakes&&typeof saved.__mistakes==='object'?saved.__mistakes:{},best=saved.__timeBest&&typeof saved.__timeBest==='object'?saved.__timeBest:{};for(const c of Object.keys(courseLabels))for(const n of [10,20]){const k=c+'-'+n;rewards[k]=Number.isSafeInteger(saved[k])&&saved[k]>=0?saved[k]:0;mistakes[k]=Array.isArray(raw[k])?(raw[k].every(Number.isSafeInteger)?raw[k]:[raw[k].length]):[];timeBest[k]=Number.isSafeInteger(best[k])&&best[k]>=0?best[k]:0;}}catch(e){storageOK=false;}\nfunction saveRewards(){try{localStorage.setItem(rewardKey,JSON.stringify({...rewards,__mistakes:mistakes,__timeBest:timeBest}));}catch(e){storageOK=false;}}\nfunction renderRewards(){const grid=$('#reward-grid');grid.innerHTML=Object.keys(courseLabels).flatMap(c=>[10,20].map(n=>{const k=c+'-'+n,count=rewards[k]||0,misses=mistakes[k]||[],shown=Math.min(count,30),marks=Array.from({length:shown},(_,i)=>'<span class=\"mark\"><span class=\"mark-star\">⭐️</span><span class=\"mark-miss\">'+(misses[i]??0)+'</span></span>').join('')+(count>30?'<span class=\"mark\"><span class=\"mark-star\">＋'+(count-30)+'</span><span class=\"mark-miss\"></span></span>':''),challenge=count>=20?'<button class=\"challenge\" data-challenge data-c=\"'+c+'\" data-n=\"'+n+'\">タイムチャレンジ</button><span class=\"best\">最高 '+(timeBest[k]||0)+'問</span>':'';return '<div class=\"reward-track\"><strong>'+courseLabels[c]+'・'+n+'問</strong>'+(count?'<div class=\"marks\">'+marks+'</div>':'<div class=\"stars\">まだこれから！</div>')+'<span class=\"reward-count\">'+count+'回クリア</span>'+challenge+'</div>';})).join('');$('#reward-storage').textContent=storageOK?'この端末・ブラウザーに記録します。共用端末では、使った人みんなの記録になります。':'このブラウザーでは保存できないため、記録は画面を閉じるまでです。';}\nfunction earnStar(c,n,miss){const k=c+'-'+n;rewards[k]=(rewards[k]||0)+1;mistakes[k]=[...(mistakes[k]||[]),miss];saveRewards();renderRewards();}renderRewards();\nfunction updateScore(count){$('#score').textContent=timeMode?'タイムチャレンジ：'+timeDone+'問　ミス '+timeMistakes+'/5　のこり '+timeLeft+'秒':'できた問題：'+total+' / '+count+'問';}\nfunction stopTimeChallenge(){if(timeTimer)clearInterval(timeTimer);timeTimer=null;timeMode=false;}\nfunction endTimeChallenge(){if(!timeMode)return;const best=Math.max(timeBest[timeCourse]||0,timeDone);timeBest[timeCourse]=best;saveRewards();renderRewards();timeMode=false;if(timeTimer)clearInterval(timeTimer);timeTimer=null;document.querySelectorAll('.answer').forEach(x=>x.disabled=true);$('#score').textContent='タイムチャレンジ終了：'+timeDone+'問・ミス '+timeMistakes+'（最高 '+best+'問）';}\nfunction startTimeChallenge(c,n){stopTimeChallenge();timeMode=true;timeLeft=60;timeDone=0;timeMistakes=0;timeCourse=c+'-'+n;$('#course').value=c;$('#count').value=n;$('#level').value='all';newRound();updateScore(n);timeTimer=setInterval(()=>{timeLeft--;updateScore(Number($('#count').value));if(timeLeft<=0)endTimeChallenge();},1000);}\n$('#reward-grid').onclick=e=>{const b=e.target.closest('[data-challenge]');if(b)startTimeChallenge(b.dataset.c,b.dataset.n);};\nfunction rand(d){return Math.floor(Math.random()*9*10**(d-1))+10**(d-1)}\nfunction hasCarry(a,b){let carry=0;const len=Math.max(String(a).length,String(b).length);for(let i=0;i<len;i++){const x=Math.floor(a/10**i)%10,y=Math.floor(b/10**i)%10,sum=x+y+carry;if(sum>=10)return true;carry=sum>=10?1:0}return false}\nfunction candidates(level,course=$('#course').value){const [ad,bd]=course.split('-').map(Number),out=[];for(let i=0;i<900;i++){const a=rand(ad),b=rand(bd),carry=hasCarry(a,b);if(level==='all'||(level==='easy'&&!carry)||(level==='carry'&&carry))out.push([a,b]);if(out.length>=80)break;}return out.length?out:candidates('all',course)}\nfunction noteMistake(){currentMistakes++;if(timeMode){timeMistakes++;updateScore(Number($('#count').value));if(timeMistakes>=5){endTimeChallenge();return true;}}return false;}\nfunction newRound(){round++;total=0;currentMistakes=0;const count=Number($('#count').value),course=$('#course').value,pool=candidates($('#level').value,course);let courseRewarded=false;const pair=Array.from({length:count},()=>pool[Math.floor(Math.random()*pool.length)]);updateScore(count);$('#cards').replaceChildren();pair.forEach(([a,b],index)=>{const card=document.createElement('article');card.className='card';const answer=String(a+b),cols=Math.max(String(a).length,String(b).length+1,answer.length),top=String(a).padStart(cols,' ').split('').map(d=>'<div class=\"cell\">'+d+'</div>').join(''),bottom=Array.from({length:cols},(_,i)=>'<div class=\"cell\">'+(i===0?'+':String(b).padStart(cols-1,' ')[i-1])+'</div>').join('');card.innerHTML='<h2>問題 '+(index+1)+'</h2><div class=\"sum\" style=\"width:'+cols*80+'px;grid-template-columns:repeat('+cols+',1fr)\">'+top+bottom+'<div class=\"line\"></div></div><p class=\"msg\" role=\"status\">一の位から やってみよう</p>';const sum=card.querySelector('.sum'),msg=card.querySelector('.msg'),padded=answer.padStart(cols,' '),inputs=[],answers={},carries={},carryValues={};let c=0,ap=String(a).padStart(cols,'0'),bp=String(b).padStart(cols,'0');for(let j=cols-1;j>0;j--){const v=Number(ap[j])+Number(bp[j])+c;c=Math.floor(v/10);if(c>0)carryValues[j-1]=c;}const carryRow=[];for(let j=0;j<cols;j++){const slot=document.createElement('div');slot.className='carry-slot';if(carryValues[j]){const box=document.createElement('input');box.className='answer carry-input';box.type='text';box.inputMode='numeric';box.autocomplete='off';box.setAttribute('aria-label','問題'+(index+1)+' '+['一','十','百','千'][cols-1-j]+'の位へのくり上がり');box.disabled=true;slot.append(box);carries[j]=box;box.addEventListener('input',()=>check(box,String(carryValues[j])));}carryRow.push(slot);}sum.prepend(...carryRow);let completed=false;function focusNextProblem(){card.nextElementSibling?.querySelector('[data-first-focus]')?.focus();}function ready(j){if(j===cols-1)return true;return ready(j+1)&&answers[j+1]?.classList.contains('ok')&&(!carries[j]||carries[j].classList.contains('ok'))}function update(){for(const [j,box] of Object.entries(answers))box.disabled=!ready(Number(j));for(const [j,box] of Object.entries(carries)){const k=Number(j);box.disabled=!(ready(k+1)&&answers[k+1]?.classList.contains('ok'));}const done=inputs.every(x=>x.classList.contains('ok'))&&Object.values(carries).every(x=>x.classList.contains('ok'));if(done&&!completed){completed=true;total++;if(timeMode){timeDone++;updateScore(count); ><p class=\"note\">コースをぜんぶクリアすると、⭐️が1つふえるよ！ 20個たまるとタイムチャレンジが出るよ！</p><div id=\"reward-grid\" class=\"reward-grid\" aria-live=\"polite\"></div><p id=\"reward-storage\" class=\"note\"></p></section><details><summary>先生・おうちの方へ</summary><p>答えとくり上がりの各位を入力した時点で判定します。各位の答えと、そこからくり上がる数は、どちらを先に入力してもかまいません。両方が正しく入力できたら次の位に進めます。小さな枠はくり上がりがある場所だけに表示します。答えに使わない左側の位は斜線にし、0を入れる必要はありません。けた数・問題数・くり上がりを変更すると、新しい問題セットに切り替わります。音はボタンで切り替えられます。誤答を消す設定を外すと、数字を残して赤い枠で知らせます。できた問題数は現在の問題セットで数えます。クリアしたコースの星とまちがえた回数、タイムチャレンジの最高記録は、この端末・ブラウザーに保存します。別の端末には引き継がれません。</p></details></main><dialog id=\"kuku\" aria-labelledby=\"kuku-title\"><div class=\"kuku-head\"><h2 id=\"kuku-title\">九九表</h2><button id=\"kuku-close\" autofocus>閉じる ×</button></div><p class=\"kuku-help\">左の数と、上の数が交わるところが答えだよ。<br>たとえば、左の「3」と上の「4」で、3 × 4 ＝ 12。</p><div class=\"kuku-scroll\"><table class=\"kuku-table\" aria-label=\"1から9までの九九表\"><thead id=\"kuku-thead\"></thead><tbody id=\"kuku-tbody\"></tbody></table></div></dialog><script>\nconst $=s=>document.querySelector(s);\n$('#kuku-thead').innerHTML='<tr><th scope=\"col\">×</th>'+Array.from({length:9},(_,i)=>'<th scope=\"col\">'+(i+1)+'</th>').join('')+'</tr>';\n$('#kuku-tbody').innerHTML=Array.from({length:9},(_,r)=>'<tr><th scope=\"row\">'+(r+1)+'</th>'+Array.from({length:9},(_,c)=>'<td tabindex=\"0\" aria-label=\"'+(r+1)+'かける'+(c+1)+'は'+(r+1)*(c+1)+'\">'+(r+1)*(c+1)+'</td>').join('')+'</tr>').join('');\nlet kukuWindow;\n$('#kuku-open').onclick=()=>{if(kukuWindow&&!kukuWindow.closed){kukuWindow.focus();return;}kukuWindow=window.open('','hissan-kuku','popup=yes,width=680,height=620,resizable=yes,scrollbars=yes');if(!kukuWindow){$('#kuku').show();return;}const doc=kukuWindow.document;doc.open();doc.write('<!doctype html><html lang=\"ja\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>九九表</title><style>body{font-family:system-ui,sans-serif;background:#f6f5ee;color:#253a37;margin:0;padding:18px}h1{font-size:24px;margin:0}p{line-height:1.7}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:440px;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}th,td{padding:10px 7px;border:1px solid #c9ddd4}th{background:#dceee5}td{background:#fff}td:hover,td:focus{background:#fff0bb;outline:2px solid #bf8d26;outline-offset:-2px}.rewards{margin:24px 0;background:#fff;border:1px solid #dce4da;border-radius:18px;padding:20px}.rewards h2{margin:0 0 8px;font-size:22px}.reward-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.reward-track{padding:12px;background:#f6f8ee;border-radius:12px}.reward-track strong{display:block;font-size:15px}.stars{font-size:24px;overflow-wrap:anywhere;line-height:1.6;min-height:38px}.reward-count{font-size:13px;color:#62756d}@media(max-width:600px){.reward-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>九九表</h1><p>左の数と上の数が交わるところが答えだよ。<br>このウィンドウをひっ算の横に置いて使おう。</p><div class=\"scroll\"><table aria-label=\"1から9までの九九表\"><thead>'+$('#kuku-thead').innerHTML+'</thead><tbody>'+$('#kuku-tbody').innerHTML+'</tbody></table></div></html>');doc.close();};$('#kuku-close').onclick=()=>$('#kuku').close();\nlet sound=false,audio,total=0,round=0,currentMistakes=0,timeMode=false,timeLeft=0,timeDone=0,timeMistakes=0,timeTimer,timeCourse='',timeBest={};\nconst rewardKey='hissan-course-stars-v2';let rewards={},mistakes={},storageOK=true;try{const saved=JSON.parse(localStorage.getItem(rewardKey)||'{}');if(saved&&typeof saved==='object'){const raw=saved.__mistakes&&typeof saved.__mistakes==='object'?saved.__mistakes:{},best=saved.__timeBest&&typeof saved.__timeBest==='object'?saved.__timeBest:{};for(const d of [2,3])for(const n of [10,15,20]){const k=d+'-'+n;rewards[k]=Number.isSafeInteger(saved[k])&&saved[k]>=0?saved[k]:0;mistakes[k]=Array.isArray(raw[k])?(raw[k].every(Number.isSafeInteger)?raw[k]:[raw[k].length]):Number.isSafeInteger(raw[k])&&raw[k]>=0?[raw[k]]:[];timeBest[k]=Number.isSafeInteger(best[k])&&best[k]>=0?best[k]:0;}}}catch(e){storageOK=false;}\nfunction saveRewards(){try{localStorage.setItem(rewardKey,JSON.stringify({...rewards,__mistakes:mistakes,__timeBest:timeBest}));}catch(e){storageOK=false;}}\nfunction renderRewards(){const grid=$('#reward-grid');grid.innerHTML=[2,3].flatMap(d=>[10,15,20].map(n=>{const k=d+'-'+n,count=rewards[k]||0,misses=mistakes[k]||[],shown=Math.min(count,30),marks=Array.from({length:shown},(_,i)=>'<span class=\"mark\"><span class=\"mark-star\">⭐️</span><span class=\"mark-miss\">'+(misses[i]??0)+'</span></span>').join('')+(count>30?'<span class=\"mark\"><span class=\"mark-star\">＋'+(count-30)+'</span><span class=\"mark-miss\"></span></span>':''),challenge=count>=20?'<button class=\"challenge\" data-challenge data-d=\"'+d+'\" data-n=\"'+n+'\">タイムチャレンジ</button><span class=\"best\">最高 '+(timeBest[k]||0)+'問</span>':'';return '<div class=\"reward-track\"><strong>'+d+'けた × 1けた・'+n+'問</strong>'+(count?'<div class=\"marks\" aria-label=\"それぞれのまちがえ回数 '+misses.slice(0,shown).join(' ')+'\">'+marks+'</div>':'<div class=\"stars\" aria-label=\"星0個\">まだこれから！</div>')+'<span class=\"reward-count\">'+count+'回クリア</span>'+challenge+'</div>';})).join('');$('#reward-storage').textContent=storageOK?'この端末・ブラウザーに記録します。共用端末では、使った人みんなの記録になります。':'このブラウザーでは保存できないため、記録は画面を閉じるまでです。';}\nfunction noteMistake(){currentMistakes++;if(timeMode){timeMistakes++;updateScore(Number($('#count').value));if(timeMistakes>=5){endTimeChallenge();return true;}}return false;}\nfunction earnStar(d,n,miss){const k=d+'-'+n;rewards[k]=(rewards[k]||0)+1;mistakes[k]=[...(mistakes[k]||[]),miss];saveRewards();renderRewards();}renderRewards();\nfunction updateScore(count){$('#score').textContent=timeMode?'タイムチャレンジ：'+timeDone+'問　ミス '+timeMistakes+'/5　のこり '+timeLeft+'秒':'できた問題：'+total+' / '+count+'問';}\nfunction stopTimeChallenge(){if(timeTimer)clearInterval(timeTimer);timeTimer=null;timeMode=false;}\nfunction endTimeChallenge(){if(!timeMode)return;const best=Math.max(timeBest[timeCourse]||0,timeDone);timeBest[timeCourse]=best;saveRewards();renderRewards();timeMode=false;if(timeTimer)clearInterval(timeTimer);timeTimer=null;document.querySelectorAll('.answer').forEach(x=>x.disabled=true);$('#score').textContent='タイムチャレンジ終了：'+timeDone+'問・ミス '+timeMistakes+'（最高 '+best+'問）';}\nfunction startTimeChallenge(d,n){stopTimeChallenge();timeMode=true;timeLeft=60;timeDone=0;timeMistakes=0;timeCourse=d+'-'+n;$('#digits').value=d;$('#count').value=n;$('#level').value='all';newRound();updateScore(n);timeTimer=setInterval(()=>{timeLeft--;updateScore(Number($('#count').value));if(timeLeft<=0)endTimeChallenge();},1000);}\n$('#reward-grid').onclick=e=>{const b=e.target.closest('[data-challenge]');if(b)startTimeChallenge(b.dataset.d,b.dataset.n);};\n\nfunction beep(ok){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=ok?660:180;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);o.start();o.stop(audio.currentTime+.17)}catch(e){}}\nfunction candidates(level,digits=Number($('#digits').value)){const out=[];for(let a=10**(digits-1);a<10**digits;a++)for(let b=2;b<=9;b++){let carry=false,c=0;for(const d of String(a).split('').reverse()){const v=Number(d)*b+c;c=Math.floor(v/10);if(c>0)carry=true;}if(level==='all'||(level==='easy'&&!carry)||(level==='carry'&&carry))out.push([a,b]);}return out;}\nfunction newRound(){round++;total=0;currentMistakes=0;const count=Number($('#count').value),digits=Number($('#digits').value),cols=digits+1,pool=candidates($('#level').value,digits);let courseRewarded=false;const pair=Array.from({length:count},()=>pool.splice(Math.floor(Math.random()*pool.length),1)[0]);updateScore(count);$('#cards').replaceChildren();pair.forEach(([a,b],index)=>{const card=document.createElement('article');card.className='card';const top=String(a).padStart(cols,' ').split('').map(d=>'<div class=\"cell\">'+d+'</div>').join('');const bottom=Array.from({length:cols},(_,i)=>'<div class=\"cell\">'+(i===0?'×':i===cols-1?b:'')+'</div>').join('');card.innerHTML='<h2>問題 '+(index+1)+'</h2><div class=\"sum\" style=\"width:'+cols*80+'px;grid-template-columns:repeat('+cols+',1fr)\">'+top+bottom+'<div class=\"line\"></div></div><p class=\"msg\" role=\"status\">一の位から やってみよう</p>';const sum=card.querySelector('.sum'),msg=card.querySelector('.msg'),answer=String(a*b).padStart(cols,' '),inputs=[],answers={},carries={},carryValues={};let completed=false,c=0;const padded=String(a).padStart(cols,'0');for(let j=cols-1;j>0;j--){c=Math.floor((Number(padded[j])*b+c)/10);if(c>0)carryValues[j-1]=c;}const carryRow=[];for(let j=0;j<cols;j++){const slot=document.createElement('div');slot.className='carry-slot';if(carryValues[j]){const box=document.createElement('input');box.className='answer carry-input';box.type='text';box.inputMode='numeric';box.autocomplete='off';box.setAttribute('aria-label','問題'+(index+1)+' '+['一','十','百','千'][cols-1-j]+'の位へのくり上がり');box.disabled=true;slot.append(box);carries[j]=box;box.addEventListener('input',()=>check(box,String(carryValues[j])));}carryRow.push(slot);}sum.prepend(...carryRow);\nfunction focusNextProblem(){card.nextElementSibling?.querySelector('[data-first-focus]')?.focus();}\nfunction update(){function ready(j){if(j===cols-1)return true;return ready(j+1)&&!!answers[j+1]?.classList.contains('ok')&&(!carries[j]||carries[j].classList.contains('ok'));}for(const [j,box] of Object.entries(answers))box.disabled=!ready(Number(j));for(const [j,box] of Object.entries(carries))box.disabled=!ready(Number(j)+1);const done=inputs.every(x=>x.classList.contains('ok'))&&Object.values(carries).every(x=>x.classList.contains('ok'));if(done){msg.textContent='◎ せいかい！ よくできたね';if(!completed){completed=true;total++;if(timeMode){timeDone++;updateScore(count);if(timeLeft>0){if(total===count)setTimeout(()=>{if(timeMode)newRound();},500);else setTime te('aria-pressed',String(sound));if(sound)beep(true)};newRound();\n<\/script></html>\n","division":"<!doctype html><html lang=\"ja\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>わり算のひっ算れんしゅう</title><style>\n*{box-sizing:border-box}body{margin:0;background:#f6f5ee;color:#253a37;font-family:system-ui,sans-serif}main{max-width:980px;margin:auto;padding:30px 22px}header{display:flex;justify-content:space-between;align-items:center;gap:15px}small{color:#47776c;font-weight:700}h1{font-size:clamp(24px,5vw,36px);margin:8px 0}button,select{font:inherit;cursor:pointer;border:1px solid #c4d6ce;border-radius:12px;padding:12px;background:white;color:inherit}button:focus-visible,select:focus-visible{outline:3px solid #ecb741}button.primary{background:#247d66;color:white;border:0;font-weight:700}section.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:24px 0}label{display:flex;gap:8px;align-items:center}.intro{line-height:1.8}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{background:white;border:1px solid #dce4da;border-radius:22px;padding:22px;box-shadow:0 5px 0 #e5e9df}.card h2{font-size:16px;color:#60796f;margin:0 0 12px}.sum{width:240px;max-width:100%;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);font-size:46px;text-align:center;font-variant-numeric:tabular-nums}.carry-slot{height:48px;display:flex;align-items:center;justify-content:center}.answer.carry-input{width:30px;min-width:30px;max-width:30px;height:30px;padding:0;border-width:2px;font-size:20px;border-radius:5px;flex:none}.answer:disabled{background:#edf0eb;border-color:#cad3cc;color:#83958b;cursor:not-allowed}.cell{height:66px;display:flex;align-items:center;justify-content:center;border-right:1px solid #e6ece7}.line{grid-column:1/-1;border-bottom:3px solid #344d45;margin:4px 0 12px}.answer{width:calc(100% - 10px);height:74px;justify-self:center;border:3px solid #358ba5;border-radius:9px;font:i swer.grade3-input{width:74px;height:74px;font-size:44px}</style><main><header><div><small>小学3年生・算数</small><h1>わり算のひっ算れんしゅう</h1></div><div class=\"header-actions\"><a href=\"index.html\"><button>メニューへ</button></a><button id=\"sound\" aria-pressed=\"false\">音：なし</button></div></header><p class=\"intro\">九九をつかって、<b>たてる → かける → ひく</b> の順に書こう。<br>答えは1けた。さいごの あまりは、わり切れるとき「0」だよ！</p><section class=\"tools\"><button id=\"kuku-open\" aria-label=\"九九表を見る（別ウィンドウ）\">九九表を見る ↗</button><label>問題<select id=\"digits\"><option value=\"1\">1けた ÷ 1けた</option><option value=\"2\" selected>2けた ÷ 1けた</option></select></label><label>問題数<select id=\"count\"><option value=\"10\">10問</option><option value=\"15\">15問</option><option value=\"20\">20問</option></select></label><label>あまり<select id=\"level\"><option value=\"all\">すべて</option><option value=\"easy\">あまりなし</option><option value=\"carry\">あまりあり</option></select></label><label><input id=\"erase\" type=\"checkbox\" checked>まちがえた数字を消す</label></section><div class=\"cards\" id=\"cards\"></div><div class=\"footer\"><strong id=\"score\" aria-live=\"polite\">できた問題：0問</strong><button class=\"primary\" id=\"next\">あたらしい問題 ↻</button></div><p class=\"note\">キーボードでも、タブレットの数字キーボードでも入力できます。色とメッセージでも正誤がわかります。</p><section class=\"rewards\" aria-labelledby=\"reward-title\"><h2 id=\"reward-title\">⭐️ がんばりの記録</h2><p class=\"note\">コースをぜんぶクリアすると、⭐️が1つふえるよ！ 20個たまるとタイムチャレンジが出るよ！</p><div id=\"reward-grid\" class=\"reward-grid\" aria-live=\"polite\"></div><p id=\"reward-storage\" class=\"note\"></p></section><details><summary>先生・おうちの方へ</summary><p>3年生向けに、わる数と答え（商）が1けたで、九九を1回使って解ける問題に限定しています。答えが0の問題は含めません。次の位へわり進めるひっ算や、3けたの問題は出ません。ひっ算形式で、上の答え（商）→かけ算の結果→ひき算の結果（あまり）の順に入力します。同じ段の枠はどちらから書いてもかまいません。割り切れる場合はあまりに0を入力します。星とまちがえた回数、タイムチャレンジの最高記録は、この端末・ブラウザーに保存し、4年生向けだった以前のひっ算版とは別に数えます。設定を変えると新しい問題セットになります。</p></details></main><dialog id=\"kuku\" aria-labelledby=\"kuku-title\"><div class=\"kuku-head\"><h2 id=\"kuku-title\">九九表</h2><button id=\"kuku-close\" autofocus>閉じる ×</button></div><p class=\"kuku-help\">左の数と、上の数が交わるところが答えだよ。<br>たとえば、左の「3」と上の「4」で、3 × 4 ＝ 12。</p><div class=\"kuku-scroll\"><table class=\"kuku-table\" aria-label=\"1から9までの九九表\"><thead id=\"kuku-thead\"></thead><tbody id=\"kuku-tbody\"></tbody></table></div></dialog><script>\nconst $=s=>document.querySelector(s);\n$('#kuku-thead').innerHTML='<tr><th scope=\"col\">×</th>'+Array.from({length:9},(_,i)=>'<th scope=\"col\">'+(i+1)+'</th>').join('')+'</tr>';\n$('#kuku-tbody').innerHTML=Array.from({length:9},(_,r)=>'<tr><th scope=\"row\">'+(r+1)+'</th>'+Array.from({length:9},(_,c)=>'<td tabindex=\"0\" aria-label=\"'+(r+1)+'かける'+(c+1)+'は'+(r+1)*(c+1)+'\">'+(r+1)*(c+1)+'</td>').join('')+'</tr>').join('');\nlet kukuWindow;\n$('#kuku-open').onclick=()=>{if(kukuWindow&&!kukuWindow.closed){kukuWindow.focus();return;}kukuWindow=window.open('','division-kuku','popup=yes,width=680,height=620,resizable=yes,scrollbars=yes');if(!kukuWindow){$('#kuku').show();return;}const doc=kukuWindow.document;doc.open();doc.write('<!doctype html><html lang=\"ja\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>九九表</title><style>body{font-family:system-ui,sans-serif;background:#f6f5ee;color:#253a37;margin:0;padding:18px}h1{font-size:24px;margin:0}p{line-height:1.7}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:440px;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}th,td{padding:10px 7px;border:1px solid #c9ddd4}th{background:#dceee5}td{background:#fff}td:hover,td:focus{background:#fff0bb;outline:2px solid #bf8d26;outline-offset:-2px}.rewards{margin:24px 0;background:#fff;border:1px solid #dce4da;border-radius:18px;padding:20px}.rewards h2{margin:0 0 8px;font-size:22px}.reward-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.reward-track{padding:12px;background:#f6f8ee;border-radius:12px}.reward-track strong{display:block;font-size:15px}.stars{font-size:24px;overflow-wrap:anywhere;line-height:1.6;min-height:38px}.reward-count{font-size:13px;color:#62756d}@media(max-width:600px){.reward-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>九九表</h1><p>左の数と上の数が交わるところが答えだよ。<br>このウィンドウをひっ算の横に置いて使おう。</p><div class=\"scroll\"><table aria-label=\"1から9までの九九表\"><thead>'+$('#kuku-thead').innerHTML+'</thead><tbody>'+$('#kuku-tbody').innerHTML+'</tbody></table></div></html>');doc.close();};$('#kuku-close').onclick=()=>$('#kuku').close();\nlet sound=false,audio,total=0,round=0,currentMistakes=0,timeMode=false,timeLeft=0,timeDone=0,timeMistakes=0,timeTimer,timeCourse='',timeBest={};\nconst rewardKey='division-grade3-stars-v1';let rewards={},mistakes={},storageOK=true;try{const saved=JSON.parse(localStorage.getItem(rewardKey)||'{}');if(saved&&typeof saved==='object'){const raw=saved.__mistakes&&typeof saved.__mistakes==='object'?saved.__mistakes:{},best=saved.__timeBest&&typeof saved.__timeBest==='object'?saved.__timeBest:{};for(const d of [1,2])for(const n of [10,15,20]){const k=d+'-'+n;rewards[k]=Number.isSafeInteger(saved[k])&&saved[k]>=0?saved[k]:0;mistakes[k]=Array.isArray(raw[k])?(raw[k].every(Number.isSafeInteger)?raw[k]:[raw[k].length]):Number.isSafeInteger(raw[k])&&raw[k]>=0?[raw[k]]:[];timeBest[k]=Number.isSafeInteger(best[k])&&best[k]>=0?best[k]:0;}}}catch(e){storageOK=false;}\nfunction saveRewards(){try{localStorage.setItem(rewardKey,JSON.stringify({...rewards,__mistakes:mistakes,__timeBest:timeBest}));}catch(e){storageOK=false;}}\nfunction renderRewards(){const grid=$('#reward-grid');grid.innerHTML=[1,2].flatMap(d=>[10,15,20].map(n=>{const k=d+'-'+n,count=rewards[k]||0,misses=mistakes[k]||[],shown=Math.min(count,30),marks=Array.from({length:shown},(_,i)=>'<span class=\"mark\"><span class=\"mark-star\">⭐️</span><span class=\"mark-miss\">'+(misses[i]??0)+'</span></span>').join('')+(count>30?'<span class=\"mark\"><span class=\"mark-star\">＋'+(count-30)+'</span><span class=\"mark-miss\"></span></span>':''),challenge=count>=20?'<button class=\"challenge\" data-challenge data-d=\"'+d+'\" data-n=\"'+n+'\">タイムチャレンジ</button><span class=\"best\">最高 '+(timeBest[k]||0)+'問</span>':'';return '<div class=\"reward-track\"><strong>'+d+'けた ÷ 1けた・'+n+'問</strong>'+(count?'<div class=\"marks\" aria-label=\"それぞれのまちがえ回数 '+misses.slice(0,shown).join(' ')+'\">'+marks+'</div>':'<div class=\"stars\" aria-label=\"星0個\">まだこれから！</div>')+'<span class=\"reward-count\">'+count+'回クリア</span>'+challenge+'</div>';})).join('');$('#reward-storage').textContent=storageOK?'この端末・ブラウザーに記録します。共用端末では、使った人みんなの記録になります。':'このブラウザーでは保存できないため、記録は画面を閉じるまでです。';}\nfunction noteMistake(){currentMistakes++;if(timeMode){timeMistakes++;updateScore(Number($('#count').value));if(timeMistakes>=5){endTimeChallenge();return true;}}return false;}\nfunction earnStar(d,n,miss){const k=d+'-'+n;rewards[k]=(rewards[k]||0)+1;mistakes[k]=[...(mistakes[k]||[]),miss];saveRewards();renderRewards();}renderRewards();\nfunction updateScore(count){$('#score').textContent=timeMode?'タイムチャレンジ：'+timeDone+'問　ミス '+timeMistakes+'/5　のこり '+timeLeft+'秒':'できた問題：'+total+' / '+count+'問';}\nfunction stopTimeChallenge(){if(timeTimer)clearInterval(timeTimer);timeTimer=null;timeMode=false;}\nfunction endTimeChallenge(){if(!timeMode)return;const best=Math.max(timeBest[timeCourse]||0,timeDone);timeBest[timeCourse]=best;saveRewards();renderRewards();timeMode=false;if(timeTimer)clearInterval(timeTimer);timeTimer=null;document.querySelectorAll('.answer').forEach(x=>x.disabled=true);$('#score').textContent='タイムチャレンジ終了：'+timeDone+'問・ミス '+timeMistakes+'（最高 '+best+'問）';}\nfunction startTimeChallenge(d,n){stopTimeChallenge();timeMode=true;timeLeft=60;timeDone=0;timeMistakes=0;timeCourse=d+'-'+n;$('#digits').value=d;$('#count').value=n;$('#level').value='all';newRound();updateScore(n);timeTimer=setInterval(()=>{timeLeft--;updateScore(Number($('#count').value));if(timeLeft<=0)endTimeChallenge();},1000);}\n$('#reward-grid').onclick=e=>{const b=e.target.closest('[data-challenge]');if(b)startTimeChalle
