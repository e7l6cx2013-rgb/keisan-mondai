<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひき算のひっ算れんしゅう</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ee;color:#253a37;font-family:system-ui,sans-serif}main{max-width:980px;margin:auto;padding:30px 22px}header{display:flex;justify-content:space-between;align-items:center;gap:15px}small{color:#47776c;font-weight:700}h1{font-size:clamp(24px,5vw,36px);margin:8px 0}button,select{font:inherit;cursor:pointer;border:1px solid #c4d6ce;border-radius:12px;padding:12px;background:white;color:inherit}button:focus-visible,select:focus-visible{outline:3px solid #ecb741}.primary{background:#247d66;color:white;border:0;font-weight:700}.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:24px 0}label{display:flex;gap:8px;align-items:center}.intro{line-height:1.8}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{background:white;border:1px solid #dce4da;border-radius:22px;padding:22px;box-shadow:0 5px 0 #e5e9df}.card h2{font-size:16px;color:#60796f;margin:0 0 12px}.sum{max-width:100%;margin:auto;display:grid;font-size:46px;text-align:center;font-variant-numeric:tabular-nums}.cell{height:66px;display:flex;align-items:center;justify-content:center;border-right:1px solid #e6ece7}.line{grid-column:1/-1;border-bottom:3px solid #344d45;margin:4px 0 12px}.answer{width:calc(100% - 10px);height:74px;justify-self:center;border:3px solid #358ba5;border-radius:9px;font:inherit;text-align:center;background:#f8fcff;color:#253a37;caret-color:#247d66}.answer:focus{outline:3px solid #f3ca62;outline-offset:3px}.answer:disabled{background:#edf0eb;border-color:#cad3cc;color:#83958b}.answer.ok{border-color:#2c9474;background:#ecf8f0}.answer.bad{border-color:#ce5b54;background:#fff0ee;animation:shake .25s}.unused{height:74px;background:repeating-linear-gradient(135deg,#f5f6f3,#f5f6f3 5px,#edf0e9 5px,#edf0e9 6px);margin:0 5px;border-radius:9px}.msg{text-align:center;min-height:30px;margin:18px 0 0;font-weight:700}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:24px 0;flex-wrap:wrap}.note{font-size:13px;line-height:1.7;color:#62756d}.rewards{margin:24px 0;background:#fff;border:1px solid #dce4da;border-radius:18px;padding:20px}.rewards h2{margin:0 0 8px;font-size:22px}.reward-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.reward-track{padding:12px;background:#f6f8ee;border-radius:12px}.reward-track strong{display:block;font-size:15px}.marks{display:grid;grid-template-columns:repeat(auto-fill,32px);gap:2px 6px;max-width:100%;margin-top:6px}.mark{text-align:center;min-width:0}.mark-star{display:block;font-size:24px;line-height:1.25}.mark-miss{display:block;font-size:12px;line-height:1.4;color:#7a6a38;font-variant-numeric:tabular-nums}.stars{font-size:24px;line-height:1.6;min-height:38px}.reward-count{font-size:13px;color:#62756d}details{margin-top:26px;background:#eaf0e8;border-radius:12px;padding:16px}summary{cursor:pointer;font-weight:700}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@media(max-width:650px){main{padding:20px 16px}.cards,.reward-grid{grid-template-columns:1fr}.sum{font-size:42px}header{align-items:flex-start}}
</style><main><header><div><small>小学3年生・算数</small><h1>ひき算のひっ算れんしゅう</h1></div><a href="index.html"><button>メニューへ</button></a></header><p class="intro">右の <b>一の位</b> から、答えをひとつずつ入れよう。<br>答えがマイナスになる問題は出ません。</p><section class="tools"><label>コース<select id="course"><option value="2-1">2けた − 1けた</option><option value="2-2">2けた − 2けた</option><option value="3-2">3けた − 2けた</option><option value="3-3">3けた − 3けた</option></select></label><label>問題数<select id="count"><option value="10">10問</option><option value="20">20問</option></select></label><label>くり下がり<select id="level"><option value="all">すべて</option><option value="easy">くり下がりなし</option><option value="carry">くり下がりあり</option></select></label><label><input id="erase" type="checkbox" checked>まちがえた数字を消す</label></section><div class="cards" id="cards"></div><div class="footer"><strong id="score" aria-live="polite">できた問題：0問</strong><button class="primary" id="next">あたらしい問題 ↻</button></div><p class="note">キーボードでも、タブレットの数字キーボードでも入力できます。色とメッセージでも正誤がわかります。</p><section class="rewards" aria-labelledby="reward-title"><h2 id="reward-title">⭐️ がんばりの記録</h2><p class="note">コースをぜんぶクリアすると、⭐️が1つふえるよ！</p><div id="reward-grid" class="reward-grid" aria-live="polite"></div><p id="reward-storage" class="note"></p></section><details><summary>先生・おうちの方へ</summary><p>答えの各位を一の位から入力します。コースと問題数ごとに星とまちがえた数を、この端末・ブラウザーに保存します。くり下がりの有無で問題を選べます。</p></details></main><script>
const $=s=>document.querySelector(s),courseLabels={'2-1':'2けた − 1けた','2-2':'2けた − 2けた','3-2':'3けた − 2けた','3-3':'3けた − 3けた'};let total=0,round=0,currentMistakes=0,rewards={},mistakes={},storageOK=true;
const rewardKey='subtraction-course-stars-v1';try{const saved=JSON.parse(localStorage.getItem(rewardKey)||'{}'),raw=saved.__mistakes&&typeof saved.__mistakes==='object'?saved.__mistakes:{};for(const c of Object.keys(courseLabels))for(const n of [10,20]){const k=c+'-'+n;rewards[k]=Number.isSafeInteger(saved[k])&&saved[k]>=0?saved[k]:0;mistakes[k]=Array.isArray(raw[k])?(raw[k].every(Number.isSafeInteger)?raw[k]:[raw[k].length]):[];}}catch(e){storageOK=false;}
function saveRewards(){try{localStorage.setItem(rewardKey,JSON.stringify({...rewards,__mistakes:mistakes}));}catch(e){storageOK=false;}}
function renderRewards(){const grid=$('#reward-grid');grid.innerHTML=Object.keys(courseLabels).flatMap(c=>[10,20].map(n=>{const k=c+'-'+n,count=rewards[k]||0,misses=mistakes[k]||[],shown=Math.min(count,30),marks=Array.from({length:shown},(_,i)=>'<span class="mark"><span class="mark-star">⭐️</span><span class="mark-miss">'+(misses[i]??0)+'</span></span>').join('')+(count>30?'<span class="mark"><span class="mark-star">＋'+(count-30)+'</span><span class="mark-miss"></span></span>':'');return '<div class="reward-track"><strong>'+courseLabels[c]+'・'+n+'問</strong>'+(count?'<div class="marks">'+marks+'</div>':'<div class="stars">まだこれから！</div>')+'<span class="reward-count">'+count+'回クリア</span></div>';})).join('');$('#reward-storage').textContent=storageOK?'この端末・ブラウザーに記録します。共用端末では、使った人みんなの記録になります。':'このブラウザーでは保存できないため、記録は画面を閉じるまでです。';}
function earnStar(c,n,miss){const k=c+'-'+n;rewards[k]=(rewards[k]||0)+1;mistakes[k]=[...(mistakes[k]||[]),miss];saveRewards();renderRewards();}renderRewards();
function rand(d){return Math.floor(Math.random()*9*10**(d-1))+10**(d-1)}
function hasBorrow(a,b){let borrow=0;const len=Math.max(String(a).length,String(b).length);for(let i=0;i<len;i++){let x=Math.floor(a/10**i)%10-borrow,y=Math.floor(b/10**i)%10;if(x<y)return true;borrow=x<y?1:0}return false}
function candidates(level,course=$('#course').value){const [ad,bd]=course.split('-').map(Number),out=[];for(let i=0;i<1600;i++){let a=rand(ad),b=rand(bd);if(a<=b)continue;const borrow=hasBorrow(a,b);if(level==='all'||(level==='easy'&&!borrow)||(level==='carry'&&borrow))out.push([a,b]);if(out.length>=80)break;}return out.length?out:candidates('all',course)}
function noteMistake(){currentMistakes++}
function newRound(){round++;total=0;currentMistakes=0;const count=Number($('#count').value),course=$('#course').value,pool=candidates($('#level').value,course);let courseRewarded=false;const pair=Array.from({length:count},()=>pool[Math.floor(Math.random()*pool.length)]);$('#score').textContent='できた問題：0 / '+count+'問';$('#cards').replaceChildren();pair.forEach(([a,b],index)=>{const card=document.createElement('article');card.className='card';const answer=String(a-b),cols=String(a).length,top=String(a).padStart(cols,' ').split('').map(d=>'<div class="cell">'+d+'</div>').join(''),bottom=Array.from({length:cols},(_,i)=>'<div class="cell">'+(i===0?'−':String(b).padStart(cols,' ')[i])+'</div>').join('');card.innerHTML='<h2>問題 '+(index+1)+'</h2><div class="sum" style="width:'+cols*80+'px;grid-template-columns:repeat('+cols+',1fr)">'+top+bottom+'<div class="line"></div></div><p class="msg" role="status">一の位から やってみよう</p>';const sum=card.querySelector('.sum'),msg=card.querySelector('.msg'),padded=answer.padStart(cols,' '),inputs=[],answers={};let completed=false;function focusNextProblem(){card.nextElementSibling?.querySelector('[data-first-focus]')?.focus();}function ready(j){return j===cols-1||answers[j+1]?.classList.contains('ok')}function update(){for(const [j,box] of Object.entries(answers))box.disabled=!ready(Number(j));const done=inputs.every(x=>x.classList.contains('ok'));if(done&&!completed){completed=true;total++;if(total===count&&!courseRewarded){courseRewarded=true;earnStar(course,count,currentMistakes);}$('#score').textContent=total===count?'⭐️ '+count+'問ぜんぶできたね！ 星を1つゲット！':'できた問題：'+total+' / '+count+'問';if(total===count){const finishedRound=round;setTimeout(()=>{if(round===finishedRound)newRound();},1500);}else setTimeout(focusNextProblem,0);}return done}function check(input,expected){if(input.disabled)return;const value=input.value.normalize('NFKC').replace(/[^0-9]/g,'').slice(-1);input.value=value;input.classList.remove('bad','ok');if(!value){msg.textContent='数字を入れてみよう';update();return}if(value!==expected){input.classList.add('bad');msg.textContent='もう一度 考えてみよう';noteMistake();if($('#erase').checked)input.value='';update();return}input.classList.add('ok');if(!update()){msg.textContent='その数字で あっているよ！';for(let j=cols-1;j>=0;j--){const next=answers[j];if(next&&!next.disabled&&!next.classList.contains('ok')){next.focus();break;}}}}for(let i=0;i<cols;i++){if(padded[i]===' '){const empty=document.createElement('div');empty.className='unused';sum.append(empty);continue}const input=document.createElement('input');input.className='answer';input.type='text';input.inputMode='numeric';input.autocomplete='off';if(i===cols-1)input.dataset.firstFocus='';input.setAttribute('aria-label','問題'+(index+1)+' '+['一','十','百','千'][cols-1-i]+'の位');sum.append(input);inputs.push(input);answers[i]=input;input.addEventListener('input',()=>check(input,padded[i]));}update();$('#cards').append(card);});}
$('#next').onclick=newRound;$('#course').onchange=newRound;$('#count').onchange=newRound;$('#level').onchange=newRound;newRound();
</script></html>
