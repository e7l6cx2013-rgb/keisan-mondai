<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>れんしゅうメニュー</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f5ee;color:#233a36;font-family:system-ui,sans-serif}
main{min-height:100vh;max-width:1080px;margin:auto;padding:38px 22px 46px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:28px}
small{display:block;color:#4f7669;font-weight:800;margin-bottom:8px}
h1{font-size:clamp(30px,5vw,48px);line-height:1.15;margin:0;letter-spacing:0}
.date{padding:10px 14px;border:1px solid #d6e1d7;border-radius:8px;background:white;color:#536e64;font-weight:700;white-space:nowrap}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.tile{position:relative;display:grid;grid-template-columns:92px 1fr;align-items:center;gap:20px;min-height:188px;padding:26px;border-radius:8px;border:1px solid #d7e3dd;background:white;color:inherit;text-decoration:none;box-shadow:0 5px 0 #e3e8dd;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:var(--accent)}
.tile:hover{transform:translateY(2px);box-shadow:0 3px 0 #e3e8dd}
.tile:active{transform:translateY(5px);box-shadow:none}
.tile:focus-visible{outline:4px solid #efb941;outline-offset:4px}
.mark{display:flex;align-items:center;justify-content:center;width:92px;height:92px;border-radius:8px;background:var(--soft);color:var(--accent);font-size:54px;font-weight:900;font-variant-numeric:tabular-nums}
.label{display:block;font-size:clamp(28px,4vw,40px);font-weight:900;line-height:1.25}
.sub{display:block;margin-top:10px;color:#5f776e;font-size:16px;font-weight:700;line-height:1.5}
.wide{grid-column:1 / -1}
.addition{--accent:#db5c64;--soft:#fff0f1}
.subtraction{--accent:#7b65d8;--soft:#f0edff}
.multiply{--accent:#139ee8;--soft:#e8f6ff}
.divide{--accent:#24876d;--soft:#e9f7f1}
.kanji{--accent:#c47b16;--soft:#fff3de}
footer{margin-top:24px;color:#61766e;font-size:13px;line-height:1.7}
@media(max-width:760px){
main{padding:28px 16px}
.top{display:block}
.date{display:inline-block;margin-top:16px}
.menu{grid-template-columns:1fr;gap:14px}
.tile{grid-template-columns:72px 1fr;min-height:132px;padding:18px;gap:16px}
.wide{grid-column:auto}
.mark{width:72px;height:72px;font-size:40px}
.label{font-size:28px}
.sub{font-size:14px}
}
</style>
<main>
  <header class="top">
    <div>
      <small>小学3年生・れんしゅう</small>
      <h1>今日のメニュー</h1>
    </div>
    <div class="date">がんばりの記録つき</div>
  </header>
  <nav class="menu" aria-label="れんしゅうを選ぶ">
    <a class="tile addition" href="たし算のひっ算れんしゅう.html">
      <span class="mark">＋</span>
      <span><span class="label">たし算のひっ算</span><span class="sub">2けた・3けたのたし算</span></span>
    </a>
    <a class="tile subtraction" href="ひき算のひっ算れんしゅう.html">
      <span class="mark">−</span>
      <span><span class="label">ひき算のひっ算</span><span class="sub">2けた・3けたのひき算</span></span>
    </a>
    <a class="tile multiply" href="かけ算の筆算れんしゅう.html">
      <span class="mark">×</span>
      <span><span class="label">かけ算のひっ算</span><span class="sub">2けた・3けた × 1けた</span></span>
    </a>
    <a class="tile divide" href="わり算のひっ算れんしゅう.html">
      <span class="mark">÷</span>
      <span><span class="label">わり算のひっ算</span><span class="sub">1けた・2けた ÷ 1けた</span></span>
    </a>
    <a class="tile kanji wide" href="漢字れんしゅう_2学期.html">
      <span class="mark">漢</span>
      <span><span class="label">漢字ドリル</span><span class="sub">2学期</span></span>
    </a>
  </nav>
  <footer>この端末・ブラウザーに、それぞれのがんばりの記録を保存します。</footer>
</main>
</html>
