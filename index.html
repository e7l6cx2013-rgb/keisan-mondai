<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>れんしゅうメニュー</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#1d2f35;font-family:system-ui,sans-serif}
main{min-height:100vh;max-width:1120px;margin:auto;padding:72px 28px}
h1{font-size:clamp(28px,5vw,48px);font-weight:800;margin:0 0 58px;text-align:center}
.menu{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:96px 72px;align-items:center;justify-items:center}
.tile{display:flex;align-items:center;justify-content:center;width:min(100%,360px);min-height:170px;padding:26px;border-radius:24px;background:#12a4ee;color:white;text-decoration:none;text-align:center;font-size:clamp(34px,5vw,48px);font-weight:700;line-height:1.35;box-shadow:0 8px 0 #0788c9;transition:transform .12s,box-shadow .12s,background .12s}
.tile:hover{background:#0799df;transform:translateY(2px);box-shadow:0 6px 0 #0788c9}
.tile:active{transform:translateY(7px);box-shadow:0 1px 0 #0788c9}
.tile:focus-visible{outline:5px solid #ffb12c;outline-offset:6px}
@media(max-width:700px){
main{padding:38px 18px}
h1{margin-bottom:34px}
.menu{grid-template-columns:1fr;gap:28px}
.tile{min-height:132px;font-size:34px}
}
</style>
<main>
  <h1>れんしゅうメニュー</h1>

  </nav>

</html>
